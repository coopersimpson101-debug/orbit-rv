name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for"
        required: true
permissions:
  contents: write
env:
  RISCV_TESTS_COMMIT: 1b3f8bd665d79e5985753a558dae4e3718e2edc8
jobs:
  verilog-and-results:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Verilog netlists of the SoC
        run: |
          mkdir -p dist
          python tools/export_verilog.py --out dist/orbit_rv_soc.v
          python tools/export_verilog.py --fpga-ram --out dist/orbit_rv_soc_bram.v
      # Same steps, inputs and simulator cache as the CI "test" job.
      - name: Fetch riscv-tests (pinned)
        run: |
          git clone https://github.com/riscv-software-src/riscv-tests build/riscv-tests-src
          git -C build/riscv-tests-src checkout "$RISCV_TESTS_COMMIT"
          git -C build/riscv-tests-src submodule update --init env
      - name: Build riscv-tests and benchmarks with zig cc
        run: |
          python tools/build_riscv_tests.py --src build/riscv-tests-src --out build/riscv-tests
          python tools/build_benchmarks.py --src build/riscv-tests-src --out build/bench
      - name: Cache the CXXRTL simulator
        uses: actions/cache@v6
        with:
          path: build/sim
          key: cxxrtl-${{ runner.os }}-${{ hashFiles('orbit_rv/rtl/*.py', 'orbit_rv/sim/tb.cc', 'orbit_rv/sim/__init__.py', 'orbit_rv/memmap.py') }}
      - name: Build the CXXRTL simulator (once, before any parallel runs)
        run: python -c "from orbit_rv.sim import build_sim; print(build_sim())"
      - name: riscv-tests on the RTL, every commit checked against the ISS
        run: python tools/run_riscv_tests.py --dir build/riscv-tests --sim rtl --lockstep --json dist/riscv-tests-rtl.json
      - name: IPC / cache / branch-prediction table (RTL simulation)
        run: python tools/perf_table.py --bench build/bench --out dist/perf.json
      - uses: actions/upload-artifact@v7
        with:
          name: verilog-and-results
          path: dist/

  fpga:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,fpga]"
      - name: ULX3S 85F synthesis, place-and-route and timing report (empty RAM image)
        run: |
          python fpga/ulx3s.py --out build/fpga
          mkdir -p dist
          cp build/fpga/report.json dist/fpga-report.json
          cp build/fpga/nextpnr.log dist/fpga-nextpnr.log
      - uses: actions/upload-artifact@v7
        with:
          name: fpga
          path: dist/

  publish:
    needs: [verilog-and-results, fpga]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: .github/release/${{ github.event.inputs.tag || github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/orbit_rv_soc.v
            dist/orbit_rv_soc_bram.v
            dist/riscv-tests-rtl.json
            dist/perf.json
            dist/perf.md
            dist/fpga-report.json
            dist/fpga-nextpnr.log
